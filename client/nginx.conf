# Bifrost Client - Nginx Configuration
# Serves React SPA with API proxy

# A request may carry a signed embed query when its raw path starts with
# /embed/, when its normalised path does (any case; this covers encoded,
# repeated-slash, dot-segment and absolute-form targets), or when it has an
# hmac argument (nginx matches argument names case-insensitively).
map $request $embed_log_raw {
    ~^\S+\s/embed/ 1;
    default "";
}

map $uri $embed_log_normalised {
    ~*^/embed/ 1;
    default "";
}

map "$embed_log_raw$embed_log_normalised$arg_hmac" $embed_log_redact {
    "" "";
    default 1;
}

map "$embed_log_redact $request" $embed_log_request {
    ~^1\s(?<embed_log_method>\S+)\s(?<embed_log_path>[^?]*)\?.*?(?<embed_log_protocol>\sHTTP/[0-9.]+)?$ "$embed_log_method $embed_log_path?[redacted]$embed_log_protocol";
    default $request;
}

# Referer queries are not needed for operations, and no path rule can catch
# every spelling of a signed link: log every Referer without its query.
map $http_referer $embed_log_referer {
    ~^(?<embed_log_referer_base>[^?]*)\? "$embed_log_referer_base?[redacted]";
    default $http_referer;
}

log_format embed_redacted '$remote_addr - $remote_user [$time_local] "$embed_log_request" '
                          '$status $body_bytes_sent "$embed_log_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

map $app_frame_ancestors $app_frame_csp {
    "" "";
    default "frame-ancestors $app_frame_ancestors";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log embed_redacted;

    # Max request body size (for file push, sync, etc.)
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rewrite /api/auth/* to /auth/* - frontend uses /api/auth but backend routes are at /auth
    # ^~ wins over the static-asset regex below, so /api/auth paths that end in
    # .js/.css (e.g. bundle-asset/entry-*.js) don't get trapped by the static
    # handler and 404'd instead of proxied.
    location ^~ /api/auth {
        rewrite ^/api/auth(.*)$ /auth$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API proxy - main application endpoints
    # ^~ prevents the static-asset regex below from matching /api/*.js paths
    # (bundle-asset/entry-*.js) and returning 404 instead of proxying upstream.
    location ^~ /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header Cache-Control;
        # Entity-logo URLs include the server-generated thumbnail SHA-256 in
        # `v`. Those URLs are immutable; every other API response remains
        # explicitly non-cacheable. `if` only assigns a variable here (the safe
        # nginx use of `if`) and does not alter request routing.
        set $api_cache_control "no-store, no-cache, must-revalidate";
        set $entity_logo_cache_key "$uri:$arg_v";
        if ($entity_logo_cache_key ~ "^/api/(applications|agents|solutions)/[^/]+/logo:[0-9a-f]{64}$") {
            set $api_cache_control "private, max-age=31536000, immutable";
        }
        add_header Cache-Control $api_cache_control;
    }

    # Auth callback routes - handled client-side by React Router (SSO login callbacks)
    # Must come before /auth to take precedence over the backend proxy
    location /auth/callback {
        try_files $uri $uri/ /index.html;
    }

    # Auth proxy - authentication endpoints (login, register, status, etc.)
    location /auth {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # WebSocket proxy - real-time updates
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # MCP protocol proxy - external LLM clients (Claude Desktop)
    # Regex match anchors at the boundary so /mcp and /mcp/foo proxy to the
    # API but /mcp-servers (and other admin SPA routes that start with `mcp-`)
    # fall through to the index.html fallback below. Without the boundary
    # the prefix match would catch /mcp-servers/* and the API would return
    # a 404 JSON the browser tries to download.
    location ~ ^/mcp(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # OAuth discovery endpoints for MCP clients (Claude Desktop)
    location /.well-known {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # MCP OAuth endpoints for external LLM clients
    location /register {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /authorize {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /token {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Embed entry point - HMAC-verified iframe loading
    location /embed {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # The framing policy must be attached to the final SPA document, not only
    # the token-minting redirect. Public forms resolve their exact allowlist
    # through an internal auth subrequest; HMAC embeds deliberately allow any
    # parent because the signature is the authorization boundary.
    location ~ ^/embedded/forms/public/(?<public_form_key>[^/]+)$ {
        auth_request /_public_form_frame_policy;
        auth_request_set $public_frame_ancestors $upstream_http_x_bifrost_frame_ancestors;
        # Keep the response in this location. Using /index.html as the final
        # try_files argument performs an internal redirect into the generic
        # index location and silently drops this per-publication CSP.
        try_files /index.html =404;
        add_header Content-Security-Policy "frame-ancestors $public_frame_ancestors" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }

    location = /_public_form_frame_policy {
        internal;
        proxy_pass http://api:8000/embed/forms/public/$public_form_key/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ "^/embedded/forms/hmac/(?<hmac_form_id>[0-9a-fA-F-]{36})$" {
        auth_request /_hmac_form_frame_policy;
        auth_request_set $hmac_frame_ancestors $upstream_http_x_bifrost_frame_ancestors;
        try_files /index.html =404;
        add_header Content-Security-Policy "frame-ancestors $hmac_frame_ancestors" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }

    location = /_hmac_form_frame_policy {
        internal;
        proxy_pass http://api:8000/embed/forms/hmac/$hmac_form_id/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /_app_frame_policy {
        internal;
        # Keep proxy_pass static so the host resolves at nginx startup.
        rewrite ^ /embed/apps/$app_frame_slug/frame-policy break;
        proxy_pass http://api:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # SPA fallback - serve index.html for client-side routing.
    # index.html MUST NOT be cached (no-store, not no-cache) so rolling deploys
    # don't pin the browser to a stale bundle. With replicas>1, each pod's
    # ETag for index.html differs, and `no-cache` lets browsers revalidate
    # against any pod — which can return 304 against a stale ETag and keep
    # the user on old chunk hashes through dozens of refreshes. `no-store`
    # forces a fresh fetch every time, and `etag off` prevents the
    # revalidation race in any intermediary that ignores no-store.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Apply app policies to every final document and client route, dotted
    # routes included. Regex locations match in order, so the static-asset
    # location above keeps real asset extensions.
    location ~ ^/apps/(?<app_frame_slug>[a-z][a-z0-9-]*)(?:/.*)?$ {
        auth_request /_app_frame_policy;
        auth_request_set $app_frame_ancestors $upstream_http_x_bifrost_frame_ancestors;
        try_files /index.html =404;
        # nginx omits this header when the map returns an empty value.
        add_header Content-Security-Policy $app_frame_csp always;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }
}
